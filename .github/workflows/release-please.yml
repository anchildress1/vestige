name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release APK
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_ASSET: vestige-${{ needs.release.outputs.tag_name }}.apk
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Configure release signing
        env:
          VESTIGE_RELEASE_KEYSTORE_BASE64: ${{ secrets.VESTIGE_RELEASE_KEYSTORE_BASE64 }}
          VESTIGE_RELEASE_STORE_PASSWORD: ${{ secrets.VESTIGE_RELEASE_STORE_PASSWORD }}
          VESTIGE_RELEASE_KEY_ALIAS: ${{ secrets.VESTIGE_RELEASE_KEY_ALIAS }}
          VESTIGE_RELEASE_KEY_PASSWORD: ${{ secrets.VESTIGE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            VESTIGE_RELEASE_KEYSTORE_BASE64 \
            VESTIGE_RELEASE_STORE_PASSWORD \
            VESTIGE_RELEASE_KEY_ALIAS \
            VESTIGE_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release signing secret::$name is required before publishing release APK assets"
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/vestige-release.jks"
          printf '%s' "$VESTIGE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$VESTIGE_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$VESTIGE_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$VESTIGE_RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release APK
        env:
          ENV: prod
        run: make assemble

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_ASSET}"
          (
            cd release-assets
            sha256sum "${APK_ASSET}" > "${APK_ASSET}.sha256"
          )

      - name: Clean up release signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/vestige-release.jks"

      - name: Upload release APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/${APK_ASSET}" \
            "release-assets/${APK_ASSET}.sha256" \
            --clobber
